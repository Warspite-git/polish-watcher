# =====================================================================
#  Polish Watcher — lojas monitoradas
#  Para adicionar uma loja, basta incluir um item em "lojas" no final.
#  O README.md explica cada opção em detalhes.
# =====================================================================

# Valores padrão para TODAS as lojas. Cada loja pode sobrescrever
# qualquer um deles (veja os exemplos comentados lá embaixo).
padrao:
  plataforma: auto          # auto | nuvemshop | shopify
  pausa_segundos: 1.5       # pausa entre requisições na mesma loja
  alertas:
    novos: true             # produto novo no catálogo
    restock: true           # produto/variante voltou ao estoque
    reposicao: 5            # chegaram N+ unidades num produto que não tinha esgotado (false desliga)
    estoque_baixo: false    # false ou um número (ex.: 3 → avisa quando cair para 3 ou menos)
    preco: false            # mudança de preço
    loja_fechada: true      # loja fechou com senha / reabriu (lançamentos, reformas)
    esgotou: false          # true = responde ao alerta original quando o produto esgota
  filtros:
    incluir: []             # se tiver algo, só avisa de produtos com alguma dessas palavras
    excluir: []             # nunca avisa de produtos com alguma dessas palavras

telegram:
  max_alertas_individuais: 10   # acima disso na mesma rodada, agrupa em álbuns
  urgencia_estoque: 5           # selo "🔥 Últimas unidades" com N ou menos (0 desliga)
  mostrar_estoque: false        # true = mostra a quantidade em estoque nos alertas (grupo principal)
  mostrar_estoque_privado: true # grupo privado (TELEGRAM_CHAT_ID_PRIVADO): mostra a quantidade
  sair_de_outros_grupos: true   # o bot sai de qualquer grupo que não seja o principal ou o privado

avancado:
  falhas_para_avisar: 8         # avisa no Telegram após N rodadas seguidas com erro (~2h)
  max_paginas_produto: 15       # máx. de páginas de produto abertas por loja por rodada

lojas:
  - nome: Elbe
    url: https://www.elbepolish.com.br/

  - nome: Nothing Basic & Phoenix      # marca conjunta
    url: https://nothingbasicstore.com/
    hashtag: [NothingBasic, Phoenix]

  - nome: VMystic
    url: https://www.shopbyvm.com/

  - nome: Whatcha
    url: https://www.lojawhatcha.com.br/

